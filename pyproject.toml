[project]
name = "bonbast"
version = "2.0.0"
description = "Gold prices and Iranian Rial (IRR) exchange rates from bonbast.com, in your terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Amir Hossein SamadiPour", email = "samadipoor2@gmail.com" },
    { name = "Alireza Azadi", email = "alireza_azadi@hotmail.com" },
    { name = "Iliya Aghamajidi", email = "dozheiny@gmail.com" },
    { name = "Parsa Shahmaleki", email = "parsampsh@gmail.com" },
]
keywords = ["bonbast", "iran", "rial", "toman", "exchange rates", "gold", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.11",
    "click>=8.1",
    "platformdirs>=3.0",
    "requests>=2.31",
    "rich>=13.0",
]

[project.scripts]
bonbast = "bonbast.cli:cli"

[project.urls]
Homepage = "https://github.com/SamadiPour/bonbast"
Repository = "https://github.com/SamadiPour/bonbast"
Issues = "https://github.com/SamadiPour/bonbast/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
